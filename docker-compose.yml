services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trading
      MYSQL_USER: trading
      MYSQL_PASSWORD: trading
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: trading
      DB_PASSWORD: trading
      DB_NAME: trading
      JWT_SECRET: change-me-in-production
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "5000:5000"
    depends_on:
      - db
      - ai

  ai:
    build: ./ai-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
